name: Capturas QA navegador y archivo fuente
on:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'styles.css'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --omit=dev playwright@1.55.1
          npx playwright install --with-deps chromium firefox
      - name: Preparar una salida de audio virtual
        run: |
          if ! command -v pulseaudio >/dev/null || ! command -v pactl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y pulseaudio pulseaudio-utils
          fi
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=world404
          pactl set-default-sink world404
      - name: Comprobar navegación y capturar escenas
        run: node tests/browser-smoke.mjs
      - name: Publicar capturas reales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-404-v2-capturas-navegador
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 14
  source-archive:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Archivar versión exacta de la PR
        run: |
          git archive --format=zip -o WORLD-404-v2-source.zip HEAD
          sha256sum WORLD-404-v2-source.zip > WORLD-404-v2-source.zip.sha256
          unzip -t WORLD-404-v2-source.zip | tail -n 2
      - name: Subir ZIP íntegro y hash
        uses: actions/upload-artifact@v4
        with:
          name: world-404-v2-codigo-completo
          path: |
            WORLD-404-v2-source.zip
            WORLD-404-v2-source.zip.sha256
          retention-days: 14
